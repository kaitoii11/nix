name: Check

on:
  push:
  pull_request:

jobs:
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: nix flake check
        run: nix flake check --no-build

      - name: nix flake show
        run: nix flake show

  build-home-configurations:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        home:
          - kaito@vm-dev
          - kaito@vm-bastion
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build ${{ matrix.home }}
        run: nix build ".#homeConfigurations.\"${{ matrix.home }}\".activationPackage" -L
